name: Refresh profile art
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: art
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch contributions
        run: python3 generator/fetch.py jparker2006 data/contributions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render art and README
        run: python3 generator/art.py data/contributions.json assets
      - name: Check the art is honest and readable
        run: python3 tools/check.py assets && python3 tools/check.py assets art-night.svg
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets README.md
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh profile art" && git push; fi
